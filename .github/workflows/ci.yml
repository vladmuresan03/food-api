name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # PostgreSQL is provided per-test-class via Testcontainers; no service
    # container is needed here.
    env:
      FOODFINDER_ADMIN_USERNAME: test-admin
      FOODFINDER_ADMIN_PASSWORD: test-password
      FOODFINDER_STORAGE_DIR: ./target/test-storage
      FOODFINDER_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven works
        run: mvn -B -v

      - name: Run tests
        run: mvn -B test

      - name: Build runnable jar
        run: mvn -B -DskipTests package
