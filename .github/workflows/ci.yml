name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foodfinder
          POSTGRES_PASSWORD: foodfinder
          POSTGRES_DB: foodfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodfinder -d foodfinder_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/foodfinder_test
      SPRING_DATASOURCE_USERNAME: foodfinder
      SPRING_DATASOURCE_PASSWORD: foodfinder
      FOODFINDER_ADMIN_USERNAME: test-admin
      FOODFINDER_ADMIN_PASSWORD: test-password
      FOODFINDER_STORAGE_DIR: ./target/test-storage
      FOODFINDER_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven works
        run: mvn -B -v

      - name: Run tests
        run: mvn -B test

      - name: Build runnable jar
        run: mvn -B -DskipTests package
