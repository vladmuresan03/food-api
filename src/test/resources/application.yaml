# Test-only overrides. The DataSource is provided by Testcontainers via
# @ServiceConnection, so the spring.datasource.* keys that used to live
# here are gone. The foodfinder.* properties below are read by
# SecurityConfig and CsvController when running tests.

foodfinder:
  admin:
    username: test-admin
    password: test-password
  storage-dir: ./target/test-storage
  allowed-origins: http://localhost:3000

logging:
  level:
    root: WARN
    com.foodfinder: INFO
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
