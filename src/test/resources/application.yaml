spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/foodfinder_test
    username: foodfinder
    password: foodfinder
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

foodfinder:
  admin:
    username: test-admin
    password: test-password
  storage-dir: ./target/test-storage
  allowed-origins: http://localhost:3000

logging:
  level:
    root: WARN
    com.foodfinder: INFO
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
