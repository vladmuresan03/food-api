<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Edit menu item #' + ${mi.id})}"></head>
<body>
<header th:replace="~{admin/_layout :: topbar}"></header>
<nav th:replace="~{admin/_layout :: nav('menu-items')}"></nav>
<main>
    <h2>Edit menu item</h2>
    <p class="muted">Menu items are added via <a th:href="@{/admin/csv}">CSV import</a>.
       Use this form to adjust section, price, availability, and order after creation.</p>

    <div th:if="${errorMessage != null}" class="errors">
        <h3>Validation error</h3>
        <p th:text="${errorMessage}"></p>
    </div>

    <form th:action="@{'/admin/menu-items/' + ${mi.id}}" method="post">
        <table style="max-width: 720px;">
            <tbody>
            <tr>
                <td>menu</td>
                <td><code th:text="${mi.menuId}"></code></td>
            </tr>
            <tr>
                <td>product</td>
                <td><code th:text="${mi.productId}"></code></td>
            </tr>
            <tr>
                <td><label for="sectionName">section_name</label></td>
                <td>
                    <input id="sectionName" name="sectionName" required="required"
                           th:value="${mi.sectionName}"
                           style="width: 100%; padding: 0.4rem;"/>
                </td>
            </tr>
            <tr>
                <td><label for="price">price</label></td>
                <td>
                    <input id="price" name="price" type="number" step="0.01" min="0"
                           th:value="${mi.price}"
                           style="width: 100%; padding: 0.4rem;"/>
                </td>
            </tr>
            <tr>
                <td><label for="currency">currency</label></td>
                <td>
                    <input id="currency" name="currency" maxlength="3"
                           th:value="${mi.currency}"
                           style="padding: 0.4rem; width: 80px;"/>
                </td>
            </tr>
            <tr>
                <td><label for="sortOrder">sort_order</label></td>
                <td>
                    <input id="sortOrder" name="sortOrder" type="number" step="1"
                           th:value="${mi.sortOrder}"
                           style="padding: 0.4rem; width: 100px;"/>
                </td>
            </tr>
            <tr>
                <td><label for="available">available</label></td>
                <td>
                    <input id="available" name="available" type="checkbox" value="true"
                           th:checked="${mi.available}"/>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="toolbar" style="margin-top: 1rem;">
            <button type="submit">Save</button>
            <a class="secondary" th:href="@{/admin/menu-items}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
