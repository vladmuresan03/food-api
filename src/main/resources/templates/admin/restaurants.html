<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Restaurants')}"></head>
<body>
<header th:replace="~{admin/_layout :: topbar}"></header>
<nav th:replace="~{admin/_layout :: nav('restaurants')}"></nav>
<main>
    <h2>Restaurants</h2>

    <div th:if="${successMessage != null}" class="success">
        <p th:text="${successMessage}"></p>
    </div>

    <div class="toolbar">
        <form method="get" th:action="@{/admin/restaurants}">
            <input name="q" th:value="${q}" placeholder="search name or key"/>
            <input name="city" th:value="${city}" placeholder="city"/>
            <select name="status">
                <option value="">all</option>
                <option value="DRAFT" th:selected="${status == 'DRAFT'}">DRAFT</option>
                <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">ACTIVE</option>
                <option value="ARCHIVED" th:selected="${status == 'ARCHIVED'}">ARCHIVED</option>
            </select>
            <button type="submit">Filter</button>
        </form>
        <a th:href="@{/admin/restaurants/new}" style="margin-left:auto;">+ New restaurant</a>
        <a class="secondary" th:href="@{/admin/api/csv/restaurants}">Download CSV</a>
    </div>

    <div th:if="${rows.empty}" class="empty">
        <p><strong>No restaurants yet.</strong></p>
        <p>Use <a th:href="@{/admin/csv}">CSV import/export</a> to load a CSV file.</p>
    </div>

    <table th:unless="${rows.empty}">
        <thead>
        <tr>
            <th>Key</th><th>Name</th><th>City</th><th>Coordinates</th>
            <th>Menu count</th><th>Product count</th><th>Status</th>
            <th>Updated</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td><code th:text="${r.restaurantKey}"></code></td>
            <td th:text="${r.name}"></td>
            <td th:text="${r.city}"></td>
            <td class="muted" th:text="${r.latitude != null ? r.latitude + ', ' + r.longitude : '—'}"></td>
            <td th:text="${r.menuCount}"></td>
            <td th:text="${r.productCount}"></td>
            <td><span class="pill" th:classappend="'pill-' + ${#strings.toLowerCase(r.status)}" th:text="${r.status}"></span></td>
            <td class="muted" th:text="${#temporals.format(r.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td class="actions">
                <a th:href="@{'/admin/restaurants/' + ${r.restaurantKey} + '/edit'}">Edit</a>
                <form th:if="${r.status != 'ARCHIVED'}"
                      th:action="@{'/admin/restaurants/' + ${r.restaurantKey} + '/archive'}"
                      method="post" style="display:inline;margin-left:0.5rem;">
                    <button type="submit"
                            style="background:transparent;border:0;color:#dc2626;cursor:pointer;font-size:0.85rem;padding:0;"
                            onclick="return confirm('Archive this restaurant? It will no longer be visible to consumers.')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
