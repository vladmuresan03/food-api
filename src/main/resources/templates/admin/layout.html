<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>FoodFinder Admin</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --fg: #1c1c1c;
            --muted: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
            --row-hover: #f3f4f6;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
        header { background: #1f2937; color: white; padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
        header a { color: white; text-decoration: none; }
        header form { margin: 0; }
        header button { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.4); padding: 0.25rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        nav { background: white; border-bottom: 1px solid var(--border); padding: 0 1.5rem; }
        nav a { display: inline-block; padding: 0.75rem 1rem; text-decoration: none; color: var(--fg); border-bottom: 2px solid transparent; font-size: 0.9rem; }
        nav a:hover { background: var(--row-hover); }
        nav a.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
        main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
        h2 { margin-top: 0; font-weight: 600; }
        .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .toolbar form { display: flex; gap: 0.4rem; align-items: center; margin: 0; }
        .toolbar input, .toolbar select { padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; }
        .toolbar button { padding: 0.4rem 0.8rem; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .toolbar button.secondary { background: white; color: var(--fg); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        th { text-align: left; padding: 0.6rem 0.75rem; background: #f3f4f6; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
        td { padding: 0.6rem 0.75rem; border-top: 1px solid var(--border); font-size: 0.9rem; vertical-align: top; }
        tr:hover td { background: var(--row-hover); }
        .thumb { width: 56px; height: 42px; object-fit: cover; border-radius: 3px; border: 1px solid var(--border); }
        .pill { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .pill-draft { background: #fef3c7; color: #92400e; }
        .pill-active, .pill-published { background: #dcfce7; color: #166534; }
        .pill-archived { background: #e5e7eb; color: #6b7280; }
        .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); background: white; border: 1px dashed var(--border); border-radius: 4px; }
        .empty p { margin: 0.5rem 0 0; font-size: 0.95rem; }
        .actions a { color: var(--accent); text-decoration: none; font-size: 0.85rem; margin-right: 0.5rem; }
        .muted { color: var(--muted); font-size: 0.85rem; }
        .errors { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .errors table { background: white; margin-top: 0.5rem; }
        .errors h3 { margin: 0 0 0.5rem; font-size: 1rem; }
        .success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .login-card { max-width: 360px; margin: 6rem auto; background: white; padding: 2rem; border: 1px solid var(--border); border-radius: 8px; }
        .login-card h1 { margin-top: 0; }
        .login-card label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: var(--muted); }
        .login-card input { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .login-card button { margin-top: 1rem; width: 100%; padding: 0.6rem; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; }
        .login-error { color: #b91c1c; font-size: 0.85rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
<header>
    <h1><a th:href="@{/admin}">FoodFinder Admin</a></h1>
    <form th:action="@{/admin/logout}" method="post" sec:authorize="isAuthenticated()"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <span th:text="${#authentication?.name}" class="muted" style="margin-right:0.5rem;color:rgba(255,255,255,0.7);"></span>
        <button type="submit">Sign out</button>
    </form>
</header>
<nav>
    <a th:href="@{/admin}" th:classappend="${active == 'home'} ? 'active' : ''">Overview</a>
    <a th:href="@{/admin/restaurants}" th:classappend="${active == 'restaurants'} ? 'active' : ''">Restaurants</a>
    <a th:href="@{/admin/menus}" th:classappend="${active == 'menus'} ? 'active' : ''">Menus</a>
    <a th:href="@{/admin/products}" th:classappend="${active == 'products'} ? 'active' : ''">Products</a>
    <a th:href="@{/admin/menu-items}" th:classappend="${active == 'menu-items'} ? 'active' : ''">Menu items</a>
    <a th:href="@{/admin/photos}" th:classappend="${active == 'photos'} ? 'active' : ''">Photos</a>
    <a th:href="@{/admin/menu-assets}" th:classappend="${active == 'menu-assets'} ? 'active' : ''">Menu assets</a>
    <a th:href="@{/admin/csv}" th:classappend="${active == 'csv'} ? 'active' : ''">CSV import/export</a>
</nav>
<main>
    <div th:replace="${content}">Content</div>
</main>
</body>
</html>
