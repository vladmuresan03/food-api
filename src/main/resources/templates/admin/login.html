<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Sign in — FoodFinder Admin</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f9fa; }
        .login-card { max-width: 360px; margin: 6rem auto; background: white; padding: 2rem; border: 1px solid #e5e7eb; border-radius: 8px; }
        .login-card h1 { margin-top: 0; }
        .login-card label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: #6b7280; }
        .login-card input { width: 100%; padding: 0.5rem; border: 1px solid #e5e7eb; border-radius: 4px; box-sizing: border-box; }
        .login-card button { margin-top: 1rem; width: 100%; padding: 0.6rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .login-error { color: #b91c1c; font-size: 0.85rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Sign in</h1>
    <form th:action="@{/admin/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required="required" autofocus="autofocus"/>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required="required"/>
        <div class="login-error" th:if="${param.error}">Invalid username or password.</div>
        <div class="login-error" th:if="${param.logout}">You have been signed out.</div>
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
