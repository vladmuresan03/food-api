# docker-compose for local development with a real PostgreSQL.
# Production deploys on Portainer reuse the existing `postgresql_foodfinder_net`
# external network; see deploy/portainer-stack.yml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: foodfinder-api-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodfinder
      POSTGRES_USER: foodfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodfinder}
    volumes:
      - foodfinder_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodfinder -d foodfinder"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: foodfinder-api:local
    container_name: foodfinder-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodfinder
      SPRING_DATASOURCE_USERNAME: foodfinder
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foodfinder}
      FOODFINDER_ADMIN_USERNAME: ${FOODFINDER_ADMIN_USERNAME:-admin}
      FOODFINDER_ADMIN_PASSWORD: ${FOODFINDER_ADMIN_PASSWORD:-admin}
      FOODFINDER_STORAGE_DIR: /data/foodfinder
      FOODFINDER_ALLOWED_ORIGINS: ${FOODFINDER_ALLOWED_ORIGINS:-}
      PORT: "8080"
    volumes:
      - foodfinder_media:/data/foodfinder
    ports:
      - "8080:8080"

volumes:
  foodfinder_pg:
  foodfinder_media:
