# Portainer stack for production deploy.
#
# When imported into Portainer via "Stacks > Add stack > Repository",
# Portainer clones the repository, then runs `docker build` using the
# compose stack. The build context is the repo root, the Dockerfile is
# at the root. After the first build, Portainer re-uses the image for
# subsequent redeploys (and rebuilds when GitOps updates are enabled
# or a webhook fires).
#
# Networks `postgresql_foodfinder_net` and `nginx-proxy-manager_default`
# are external (created by other stacks) and are NOT defined here.
#
# In the Portainer UI set:
#   Build method:        default ("docker build" with this compose)
#   Git repository URL:  https://github.com/vladmuresan03/food-api.git
#   Compose path:        deploy/portainer-stack.yml
#   (no additional env file)
services:
  foodfinder-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: foodfinder-api:local
    container_name: foodfinder-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FOODFINDER_ADMIN_USERNAME: ${FOODFINDER_ADMIN_USERNAME}
      FOODFINDER_ADMIN_PASSWORD: ${FOODFINDER_ADMIN_PASSWORD}
      FOODFINDER_STORAGE_DIR: ${FOODFINDER_STORAGE_DIR:-/data/foodfinder}
      FOODFINDER_ALLOWED_ORIGINS: ${FOODFINDER_ALLOWED_ORIGINS}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
      PORT: "8080"
    volumes:
      - foodfinder_media:/data/foodfinder
    networks:
      - postgresql_foodfinder_net
      - nginx-proxy-manager_default
    # Bind to loopback only: useful for ad-hoc smoke tests from the host
    # (`curl http://localhost:9150/actuator/health`) without exposing
    # the app to anything except the internal Docker networks above.
    # NPM reaches the container on the same internal 8080 over
    # nginx-proxy-manager_default. Do NOT change to "9150:8080" without
    # a firewall rule — that would publish the admin port publicly.
    ports:
      - "127.0.0.1:9150:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        - 'exec 3<>/dev/tcp/127.0.0.1/${PORT}; printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; grep -q 200 <&3 || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  foodfinder_media:

networks:
  postgresql_foodfinder_net:
    external: true
    name: postgresql_foodfinder_net
  nginx-proxy-manager_default:
    external: true
    name: nginx-proxy-manager_default
