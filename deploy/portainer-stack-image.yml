# Portainer stack for production deploy.
#
# Use this when the image was built out-of-band via bin/build-image.sh on
# the Portainer host. No build context here — the image is expected to
# already exist locally as `foodfinder-api:0.1.0` (or whatever IMAGE_TAG
# you used).
#
# In Portainer UI, pick "Web editor" (not Repository) and paste this
# file's contents. Set the env vars in the Environment section.
#
# Networks `postgresql_foodfinder_net` and `nginx-proxy-manager_default`
# are external (created by other stacks) and are NOT defined here.
services:
  foodfinder-api:
    image: foodfinder-api:${IMAGE_TAG:-0.1.0}
    container_name: foodfinder-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FOODFINDER_ADMIN_USERNAME: ${FOODFINDER_ADMIN_USERNAME}
      FOODFINDER_ADMIN_PASSWORD: ${FOODFINDER_ADMIN_PASSWORD}
      FOODFINDER_STORAGE_DIR: ${FOODFINDER_STORAGE_DIR:-/data/foodfinder}
      FOODFINDER_ALLOWED_ORIGINS: ${FOODFINDER_ALLOWED_ORIGINS}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
      PORT: "8080"
    volumes:
      - foodfinder_media:/data/foodfinder
    networks:
      - postgresql_foodfinder_net
      - nginx-proxy-manager_default
    # Bind to loopback only: useful for ad-hoc smoke tests from the host
    # (`curl http://localhost:9152/actuator/health`) without exposing
    # the app to anything except the internal Docker networks above.
    # NPM reaches the container on the same internal 8080 over
    # nginx-proxy-manager_default. Do NOT change to "9152:8080" without
    # a firewall rule — that would publish the app port publicly.
    # (9150/9151 are already taken by other stacks on the host.)
    ports:
      - "127.0.0.1:9152:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        # NOTE: $$ escapes the dollar for docker-compose interpolation so
        # ${PORT} is expanded at runtime inside the container (PORT is not
        # a stack env var; a bare ${PORT} interpolates to an empty string
        # and the healthcheck connects to /dev/tcp/127.0.0.1/ and fails).
        - 'exec 3<>/dev/tcp/127.0.0.1/$${PORT}; printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; grep -q 200 <&3 || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  foodfinder_media:

networks:
  postgresql_foodfinder_net:
    external: true
    name: postgresql_foodfinder_net
  nginx-proxy-manager_default:
    external: true
    name: nginx-proxy-manager_default
